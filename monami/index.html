<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모나미 리뉴얼 포트폴리오</title>
    <link rel="stylesheet" href="../CSS/default.css">
    <link rel="stylesheet" href="../font/CSS/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>

        <main>
            <section class="hero-sec" aria-label="모나미 메인 배너">
                <div class="hero-visual">
                    <img src="img/hero-writing.jpg" alt="카페 창가에서 노트에 글을 쓰는 모습" class="pc">
                    <img src="img/hero-writing_ma.png" alt="정원 풍경이 보이는 창가에서 책을 읽는 모습" class="mo">

                    <div class="hero-copy">
                        <h1 aria-label="어쩌면 삶은 인생이라는 종이 위에 써 내려가는 펜의 기록 같습니다.">
                            <span class="hero-line">어쩌면 삶은 인생이라는 종이 위에</span>
                            <span class="hero-line">써 내려가는 펜의 기록 같습니다.</span>
                        </h1>
                        <p>모나미는 언제나 당신의 생각과 기록과 함께합니다.</p>
                    </div>
                </div>
            </section>
        </main>

        <footer>&copy;</footer>
    </div>
</body>
</html>
