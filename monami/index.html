<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모나미 리뉴얼 포트폴리오</title>
    <link rel="stylesheet" href="../CSS/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/CSS/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>

        <main>
            <section class="hero-sec" aria-label="모나미 주요 배너">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="img/page_visual4.jpg" alt="글적글적 배너" class="pc">
                            <img src="img/monami_1.png" alt="모바일 글적글적 배너" class="mo">
                        </div>

                        <div class="swiper-slide">
                            <img src="img/page_visual8.jpg" alt="주문제작 배너" class="pc">
                            <img src="img/monami_2.png" alt="모바일 주문제작 배너" class="mo">
                        </div>
                    </div>

                    <!-- 슬라이드가 바뀌어도 고정되는 HERO 문구 -->
                    <div class="hero-copy">
                        <h1>어쩌면 삶은 인생이라는 종이 위에<br>써 내려가는 펜의 기록 같습니다.</h1>
                        <p>모나미는 언제나 당신의 생각과 기록과 함께합니다.</p>
                    </div>

                    <div class="swiper-pagination" aria-label="배너 페이지 선택"></div>
                    <div class="swiper-button-prev" aria-label="이전 배너"></div>
                    <div class="swiper-button-next" aria-label="다음 배너"></div>
                    <div class="swiper-scrollbar" aria-label="배너 진행 상태"></div>
                </div>
            </section>
        </main>

        <footer>&copy;</footer>
    </div>

    <script>
        const swiper = new Swiper('.hero-sec .visual', {
            direction: 'horizontal',
            loop: true,

            pagination: {
                el: '.visual .swiper-pagination',
                clickable: true,
            },

            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },

            scrollbar: {
                el: '.visual .swiper-scrollbar',
                draggable: true,
            },
        });
    </script>
</body>
</html>
